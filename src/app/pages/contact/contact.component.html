<section class="contact-section">
    <h2>{{ t('CONTACT.TITLE') }}</h2>
    <form (ngSubmit)="sendEmail()" #contactForm="ngForm" class="contact-form">
        <div class="form-group">
            <input type="text" name="name" [(ngModel)]="form.name" required placeholder="{{ t('CONTACT.NAME') }}" />
        </div>
        <div class="form-group">
            <input type="email" name="email" [(ngModel)]="form.email" required placeholder="{{ t('CONTACT.EMAIL') }}" />
        </div>
        <div class="form-group">
            <input type="text" name="title" [(ngModel)]="form.title" required
                placeholder="{{ t('CONTACT.TITLE_FIELD') }}" />
        </div>
        <div class="form-group">
            <textarea name="message" [(ngModel)]="form.message" required
                placeholder="{{ t('CONTACT.MESSAGE') }}"></textarea>
        </div>
        <button type="submit" class="btn primary">{{ t('CONTACT.SEND') }}</button>
    </form>
</section>
